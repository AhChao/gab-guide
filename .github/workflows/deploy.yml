name: Deploy to GitHub Pages

# DORMANT: primary hosting moved to Cloudflare Pages (gab-guide.lenguage.cc, see DEPLOY.md).
# The push trigger is removed so this no longer runs on every commit; kept for recovery only.
# NOTE: vite base is now '/' (subdomain root). GitHub Pages serves from /gab-guide/, so if you
# ever re-enable this, build with `vite build --base=/gab-guide/` or assets will 404.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy
        uses: Peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
